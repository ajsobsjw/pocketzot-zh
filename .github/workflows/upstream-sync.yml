name: Sync upstream

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Beijing time)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone upstream
        run: git clone --depth 1 https://github.com/pocketzot/pocketzot.git upstream

      - name: Apply localization patch
        run: |
          cd upstream
          git apply ../localization.patch
          # Keep upstream's dependency manifest; the patch only changes its build script.
          git checkout HEAD -- package.json package-lock.json

      - name: Install dependencies
        run: cd upstream && npm ci --no-audit --no-fund

      - name: Type check
        run: cd upstream && npx tsc

      - name: Build
        run: cd upstream && npx vite build

      - name: Add offline engine and tiles
        run: node tools/fetch-offline.mjs --dist upstream/dist

      - name: Package corresponding source
        run: |
          cd upstream
          zip -qr dist/source.zip . -x 'node_modules/*' 'dist/*' '.git/*'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd upstream && npx --yes wrangler pages deploy dist --project-name pocketzot-cn --branch main --commit-dirty=true
