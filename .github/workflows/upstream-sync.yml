name: Sync upstream

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Beijing time)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chinese-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test merging upstream into the Chinese branch
        run: |
          git fetch --no-tags https://github.com/pocketzot/pocketzot.git main
          git -c user.name='PocketZot sync check' -c user.email='actions@users.noreply.github.com' merge --no-commit --no-ff FETCH_HEAD

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and regression tests
        run: npx tsc --noEmit && npx tsc -p tsconfig.test.json && npx vitest run

      - name: Build
        run: npx vite build

      - name: Add offline engine and tiles
        run: node tools/fetch-offline.mjs --dist dist

      - name: Package corresponding source
        run: zip -qr dist/source.zip . -x 'node_modules/*' 'dist/*' '.git/*'

      # Upstream compatibility is checked daily, but only the tested fork in
      # deploy.yml publishes production. Do not overwrite it with untested trunk.
      - name: Upload upstream compatibility build
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility-build
          path: dist
